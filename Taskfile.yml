# https://taskfile.dev

version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  serve:
    desc: Run Hugo dev server with drafts
    cmds:
      - hugo server --buildDrafts

  build:
    desc: Build Hugo site to ./public
    cmds:
      - hugo --minify --cleanDestinationDir

  marp-build:
    desc: Compile all Marp slide sources to HTML in static/slides/
    cmds:
      - |
        find content/course -name ".day*.md" | while IFS= read -r f; do
          rel="${f#content/course/}"
          dir="static/slides/$(dirname "$rel")"
          mkdir -p "$dir"
          outname=$(basename "$f" .md | sed 's/^\.//').html
          npx @marp-team/marp-cli --html --theme themes/marp/dracula.css --output "$dir/$outname" "$f" </dev/null
        done

  deploy:
    desc: Build Marp + Hugo, push to S3, then sync to EC2 via SSM
    dotenv: [".env"]
    cmds:
      - task: marp-build
      - hugo --minify --cleanDestinationDir --baseURL https://tochtli.lapinel-fam.club/
      - echo $AWS_PROFILE
      - aws s3 sync public/ s3://lapinel-home-server-backup/tochtli-site/ --delete --profile $AWS_PROFILE
      - |
        aws ssm send-command \
          --profile $AWS_PROFILE \
          --instance-id $INSTANCE_ID \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["aws s3 sync s3://lapinel-home-server-backup/tochtli-site/ /opt/tochtli-site/ --delete --exact-timestamps"]' \
          --output text

  update-theme:
    desc: Pull latest PaperMod theme
    cmds:
      - git submodule update --remote --merge
